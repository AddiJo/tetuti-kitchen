<!DOCTYPE html>
<!--
  Sumber gambar preview link (Open Graph). Render ulang dengan:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
    --window-size=1200,630 --virtual-time-budget=5000 \
    --screenshot=tools/og-image.png tools/og-image.html
  lalu: sips -s format jpeg -s formatOptions 72 tools/og-image.png --out assets/og-image.jpg
-->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      .canvas {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: linear-gradient(145deg, #150907 0%, #3f150c 32%, #a2411c 68%, #e0904f 100%);
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        color: #fff8f0;
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(255, 240, 225, 0.14) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 240, 225, 0.14) 1px, transparent 1px);
        background-size: 64px 64px;
      }

      .copy {
        position: absolute;
        left: 72px;
        top: 0;
        width: 520px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 20px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand img {
        width: 52px;
        height: 52px;
      }

      .brand span {
        font-family: "Playfair Display", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 40px;
        letter-spacing: -0.02em;
      }

      h1 {
        margin: 0;
        font-family: "Playfair Display", serif;
        font-weight: 600;
        font-size: 56px;
        line-height: 1.05;
        letter-spacing: -0.03em;
      }

      .menu {
        margin: 0;
        font-size: 21px;
        font-weight: 500;
        line-height: 1.45;
        color: rgba(255, 248, 240, 0.9);
      }

      .meta {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 6px;
      }

      .pill {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 22px;
        border-radius: 999px;
        background: #25d366;
        color: #08290f;
        font-size: 21px;
        font-weight: 700;
      }

      .pill svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }

      .domain {
        font-size: 21px;
        font-weight: 600;
        color: rgba(255, 248, 240, 0.85);
      }

      .deck {
        position: absolute;
        right: 0;
        top: 0;
        width: 560px;
        height: 630px;
      }

      .deck img {
        position: absolute;
        width: 296px;
        border-radius: 22px;
        border: 5px solid rgba(255, 250, 244, 0.92);
        box-shadow: 0 30px 60px rgba(24, 8, 4, 0.45);
      }

      .deck .a {
        left: 6px;
        top: 96px;
        rotate: -7deg;
      }

      .deck .b {
        left: 142px;
        top: 152px;
        rotate: 4deg;
      }

      .deck .c {
        left: 276px;
        top: 74px;
        rotate: 11deg;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="grid"></div>

      <div class="copy">
        <div class="brand">
          <img src="../assets/logo-cabai.svg" alt="" />
          <span>Tetuti Kitchen</span>
        </div>
        <h1>Pedas nampol, renyahnya bikin nagih.</h1>
        <p class="menu">Sambal Crispy · Sosis Solo · Nasi Kotak · Paket Hantaran</p>
        <div class="meta">
          <div class="pill">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.5 14.2c-.2.6-1.2 1.2-1.7 1.2-.5.1-1 .1-1.7-.1-1-.3-2.4-1-3.8-2.3-1.6-1.5-2.6-3.3-2.7-3.6-.4-.7-.6-1.4-.4-2 .1-.4.9-1.3 1.3-1.4.3-.1.7 0 .9.4l.8 1.6c.1.3.1.5 0 .7l-.4.6c-.1.2-.1.4 0 .6.3.5.8 1.2 1.5 1.8.7.6 1.3.9 1.7 1.1.2.1.4 0 .6-.1l.6-.6c.2-.2.4-.2.7-.1l1.6.8c.4.2.5.6.5.9 0 .2 0 .4-.1.5z"
              />
            </svg>
            Pesan via WhatsApp
          </div>
          <div class="domain">tetuti.my.id</div>
        </div>
      </div>

      <div class="deck">
        <img class="a" src="../assets/nasi-kotak.jpg" alt="" />
        <img class="b" src="../assets/paket-hantaran.jpg" alt="" />
        <img class="c" src="../assets/sambal-crispy.jpg" alt="" />
      </div>
    </div>
  </body>
</html>
