<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#6a1010" />
    <title>Admin — Tetuti Kitchen</title>
    <link rel="icon" href="/assets/favicon.ico" sizes="any" />
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm" />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <header class="topbar" id="topbar" hidden>
      <a class="brand" href="#/">Tetuti Admin</a>
      <div class="topbar-actions">
        <button type="button" class="icon-toggle" id="sound-toggle">
          <svg class="bell-on" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <svg class="bell-off" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            <path d="M18.63 13A17.89 17.89 0 0 1 18 8" />
            <path d="M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14" />
            <path d="M18 8a6 6 0 0 0-9.33-5" />
            <path d="M1 1l22 22" />
          </svg>
        </button>
        <button
          type="button"
          class="menu-toggle"
          id="menu-toggle"
          aria-expanded="false"
          aria-controls="nav-menu"
          aria-label="Buka menu"
          title="Menu"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
      </div>
      <nav class="nav-menu" id="nav-menu" aria-label="Menu admin" hidden>
        <a href="#/" data-nav="pesanan">Pesanan</a>
        <a href="#/menu" data-nav="menu">Menu</a>
        <a href="#/akun" data-nav="akun">Akun</a>
        <button type="button" id="logout">Keluar</button>
      </nav>
    </header>

    <main id="app">
      <p class="page muted">Memuat…</p>
    </main>

    <dialog id="cancel-dialog">
      <form method="dialog" class="stack">
        <h2>Batalkan pesanan?</h2>
        <label class="field">
          <span>Alasan batal</span>
          <textarea name="reason" rows="3"></textarea>
        </label>
        <p class="error" data-error hidden></p>
        <div class="row">
          <button class="btn" type="submit" value="back" formnovalidate>Kembali</button>
          <button class="btn danger full" type="submit" value="confirm">Batalkan pesanan</button>
        </div>
      </form>
    </dialog>

    <dialog id="paid-dialog">
      <form method="dialog" class="stack">
        <h2>Tandai lunas</h2>
        <p class="small muted">Total tagihan <span data-total></span>.</p>
        <label class="field">
          <span>Nominal diterima</span>
          <input class="input" name="amount" inputmode="numeric" />
        </label>
        <label class="field">
          <span>Waktu lunas</span>
          <input class="input" name="paid_at" type="datetime-local" />
        </label>
        <p class="error" data-error hidden></p>
        <div class="row">
          <button class="btn" type="submit" value="back" formnovalidate>Kembali</button>
          <button class="btn primary full" type="submit" value="confirm">Tandai lunas</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <noscript><p class="page">Halaman admin butuh JavaScript.</p></noscript>
    <script src="/js/config.js"></script>
    <script type="module" src="/admin/admin.js"></script>
  </body>
</html>
